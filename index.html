<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя Игра</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            color: #ffffff;
        }

        /* --- ЭКРАН 1: КНОПКА СТАРТА --- */
        #start-btn {
            background: transparent;
            color: #ffffff;
            border: 2px solid #ffffff;
            padding: 20px 50px;
            font-size: clamp(20px, 4vw, 30px);
            font-family: inherit;
            letter-spacing: 0.2em;
            cursor: pointer;
            text-transform: uppercase;
            text-shadow: 0 0 10px #ffffff;
            box-shadow: 0 0 20px #ffffff, inset 0 0 20px #ffffff;
            transition: all 0.3s ease;
            animation: pulse 2s infinite;
            z-index: 10;
        }

        #start-btn:hover {
            background: #ffffff;
            color: #000000;
            text-shadow: none;
            box-shadow: 0 0 40px #ffffff, inset 0 0 40px #ffffff;
            animation: none;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 10px #ffffff, inset 0 0 10px #ffffff; }
            50% { box-shadow: 0 0 30px #ffffff, inset 0 0 30px #ffffff; }
            100% { box-shadow: 0 0 10px #ffffff, inset 0 0 10px #ffffff; }
        }

        /* --- ЭКРАН 2: ЗНАКОМСТВО --- */
        #scene-intro {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0; left: 0;
            transition: opacity 2s ease;
        }

        #silhouette {
            opacity: 0;
            transition: opacity 5s ease-in-out;
            margin-bottom: 40px;
            filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.3));
        }

        #silhouette.show { opacity: 1; }

        #silhouette.jump {
            animation: jumpAnim 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }

        @keyframes jumpAnim {
            0% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-60px) scale(1.1); } 
            100% { transform: translateY(0) scale(1); }
        }

        #dialogue-box-intro {
            font-size: clamp(16px, 3vw, 24px);
            letter-spacing: 0.1em;
            min-height: 40px;
            text-align: center;
            padding: 0 20px;
            margin-bottom: 20px;
            color: #fff;
        }

        .cursor {
            display: inline-block;
            width: 10px;
            height: 1.2em;
            background-color: #ffffff;
            vertical-align: bottom;
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        #choices {
            display: none; 
            gap: 30px;
        }

        .choice-btn {
            background: transparent;
            color: #ffffff;
            border: 2px solid #ffffff;
            padding: 10px 40px;
            font-size: clamp(16px, 2vw, 20px);
            font-family: inherit;
            letter-spacing: 0.1em;
            pointer-events: none; 
            user-select: none;
        }

        /* --- ЭКРАН 3: СЕРАЯ КОМНАТА ДОПРОСА --- */
        #scene-room {
            display: none;
            opacity: 0;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0; left: 0;
            transition: opacity 2.5s ease;
            background: #5a5a5a;
            background-image: linear-gradient(rgba(0,0,0,0.1) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(0,0,0,0.1) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        #emerging-board {
            position: absolute;
            bottom: 40%;
            width: 300px;
            height: 200px;
            background: #111; 
            border: 15px solid #333; 
            border-radius: 15px;
            z-index: 1; 
            opacity: 0;
            transform: translateY(100px) scale(0.8);
            transition: all 2s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: 0 10px 40px rgba(0,0,0,0.8), 0 0 20px rgba(0, 255, 255, 0.2) inset;
        }
        
        #emerging-board::after {
            content: '';
            position: absolute;
            bottom: -40px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 30px;
            background: #222;
            border-radius: 0 0 10px 10px;
        }

        #emerging-board.show {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        #seated-figure {
            position: absolute;
            bottom: 28%;
            width: 220px;
            height: 330px;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.9));
            z-index: 2; 
            transition: opacity 1.5s ease;
        }

        #table {
            width: 120%;
            height: 25%;
            background: linear-gradient(to bottom, #d4a373 0%, #b5835a 10%, #8b5a2b 100%);
            border-top: 5px solid #f0cba7;
            position: absolute;
            bottom: -2%;
            z-index: 3;
            transform: perspective(600px) rotateX(15deg);
            box-shadow: 0 -5px 30px rgba(0,0,0,0.6);
            transition: opacity 1.5s ease;
        }
        
        #table::after {
            content: '';
            position: absolute;
            top: 0; left: 10%;
            width: 80%; height: 20px;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.4), transparent);
            border-radius: 50%;
            transform: translateY(-50%);
        }

        #chair {
            position: absolute;
            bottom: -2%;
            width: 80%;
            height: 120px;
            border: 15px solid #6b4226;
            border-top: none;
            border-radius: 0 0 20px 20px;
            background: transparent;
            z-index: 4;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
            transform: perspective(600px) rotateX(15deg);
            pointer-events: none;
            transition: opacity 1.5s ease;
        }

        .smoke {
            position: absolute;
            top: 21%;
            left: 50%;
            width: 35px;
            height: 35px;
            background: radial-gradient(circle, rgba(255,255,255,0.6) 0%, rgba(255,255,255,0) 70%);
            border-radius: 50%;
            opacity: 0;
            z-index: 4;
            filter: blur(1px);
        }

        @keyframes smokeRise {
            0% { transform: translate(-50%, 0) scale(0.6) rotate(0deg); opacity: 0; }
            10% { opacity: 0.7; }
            50% { transform: translate(-45%, -100px) scale(2) rotate(15deg); opacity: 0.4; }
            100% { transform: translate(-55%, -280px) scale(4) rotate(-15deg); opacity: 0; }
        }

        #text-room {
            position: absolute;
            top: 10%;
            width: 90%; 
            text-align: center;
            font-size: clamp(16px, 3vw, 24px);
            letter-spacing: 0.1em;
            z-index: 5;
            opacity: 0;
            transition: opacity 1s ease;
            text-shadow: 2px 2px 4px #000, -2px -2px 4px #000;
            color: #fff;
            white-space: pre-wrap; 
        }

        /* --- ЭКРАН 4: РАБОЧИЙ СТОЛ КОМПЬЮТЕРА --- */
        #desktop-interface {
            display: none;
            width: 100vw;
            height: 100vh;
            background-color: #3a6ea5; 
            position: absolute;
            top: 0; left: 0;
            z-index: 100;
            opacity: 0;
            transition: opacity 1s ease;
            box-sizing: border-box;
            padding: 30px;
        }

        #desktop-interface.show { opacity: 1; }

        .desktop-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100px;
            cursor: pointer;
            margin-bottom: 30px;
            padding: 10px;
            border-radius: 5px;
            transition: background 0.2s;
            user-select: none;
        }

        .desktop-icon:hover { background: rgba(255, 255, 255, 0.2); }

        .folder-icon {
            font-size: 60px;
            line-height: 1;
            margin-bottom: 5px;
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.5));
        }

        .skull-icon {
            font-size: 65px;
            line-height: 1;
            margin-bottom: 5px;
            filter: drop-shadow(0 0 10px rgba(255, 0, 0, 0.7)); 
            transition: transform 0.2s;
        }

        .desktop-icon:hover .skull-icon { transform: scale(1.1); }

        .icon-label {
            color: #fff;
            font-size: 14px;
            text-align: center;
            text-shadow: 1px 1px 2px #000;
            word-wrap: break-word;
            width: 100%;
        }

        .taskbar {
            position: absolute;
            bottom: 0; left: 0;
            width: 100%;
            height: 40px;
            background: #c0c0c0; 
            border-top: 2px solid #fff;
            display: flex;
            align-items: center;
            padding: 0 10px;
            box-sizing: border-box;
            color: #000;
            font-size: 14px;
            z-index: 110;
        }
        
        .taskbar-start {
            background: #c0c0c0;
            border: 2px solid;
            border-color: #fff #000 #000 #fff; 
            padding: 5px 15px;
            margin-right: 15px;
            color: #000;
            font-weight: bold;
            cursor: pointer;
        }

        /* --- МОДАЛЬНОЕ ОКНО (ПИСЬМО) --- */
        #letter-modal {
            display: none;
            position: absolute;
            top: 0; left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.7);
            z-index: 200;
            justify-content: center;
            align-items: center;
        }

        #letter-modal.show { display: flex; }

        .letter-paper {
            background: #f4e8c1; 
            width: 90%;
            max-width: 500px;
            padding: 40px;
            box-sizing: border-box;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), inset 0 0 50px rgba(139, 90, 43, 0.3);
            color: #222;
            font-family: 'Times New Roman', Times, serif;
            transform: rotate(-1deg);
            transition: transform 0.3s;
        }

        .letter-paper:hover { transform: rotate(0deg) scale(1.02); }

        .close-btn {
            position: absolute;
            top: 10px; right: 15px;
            font-size: 24px;
            cursor: pointer;
            color: #8b5a2b;
            font-weight: bold;
            font-family: sans-serif;
            z-index: 10;
        }

        .close-btn:hover { color: #000; }

        .photo-frame {
            background: #fff;
            padding: 10px 10px 40px 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            width: 200px;
            margin: 0 auto 30px auto;
            transform: rotate(3deg);
            position: relative;
        }

        .photo-frame::before {
            content: '';
            position: absolute;
            top: -10px; left: 50%;
            transform: translateX(-50%) rotate(-5deg);
            width: 60px; height: 25px;
            background: rgba(200, 200, 200, 0.5);
            border: 1px solid rgba(150, 150, 150, 0.5);
        }

        .old-photo {
            width: 100%;
            height: 250px;
            object-fit: cover;
            filter: grayscale(100%) sepia(30%) contrast(150%) brightness(0.8);
            background: #333;
        }

        .letter-text h3 {
            margin: 0 0 15px 0;
            font-size: 24px;
            text-align: center;
            text-decoration: underline;
        }

        .letter-text p {
            font-size: 18px;
            line-height: 1.5;
            margin-bottom: 15px;
            text-align: justify;
        }

        .letter-text .highlight {
            text-align: center;
            font-weight: bold;
            font-size: 20px;
            color: #8b0000;
            letter-spacing: 2px;
        }

        /* --- МОДАЛЬНОЕ ОКНО (ЗАДАНИЕ/ТЕСТ) --- */
        #task-modal {
            display: none;
            position: absolute;
            top: 0; left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.8);
            z-index: 200;
            justify-content: center;
            align-items: center;
        }

        #task-modal.show { display: flex; }

        .task-window {
            background: #c0c0c0;
            border: 2px solid;
            border-color: #fff #444 #444 #fff;
            width: 90%;
            max-width: 600px;
            box-shadow: 5px 5px 20px rgba(0,0,0,0.8);
            font-family: 'Tahoma', sans-serif;
            color: #000;
        }

        .task-titlebar {
            background: #000080; 
            color: #fff;
            padding: 5px 10px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .task-content { padding: 30px; }

        .task-question {
            font-size: 20px;
            margin-bottom: 25px;
            font-weight: bold;
            text-align: center;
            text-transform: uppercase;
        }

        .task-btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            font-size: 18px;
            font-family: inherit;
            background: #e0e0e0;
            border: 2px solid;
            border-color: #fff #444 #444 #fff;
            cursor: pointer;
            text-align: left;
            transition: background 0.1s;
        }

        .task-btn:hover { background: #d0d0d0; }
        .task-btn:active { border-color: #444 #fff #fff #444; background: #ccc; }

        /* --- ЭФФЕКТ ВЫКЛЮЧЕНИЯ И ЗЛЫЕ ГЛАЗА --- */
        #crt-overlay {
            position: fixed; top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: #000; z-index: 999;
            pointer-events: none; opacity: 0;
            transition: all 0.3s ease-in;
        }
        #crt-overlay.active { opacity: 1; }

        #anger-overlay {
            display: none;
            position: fixed; top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: #000; z-index: 1000;
            justify-content: center; align-items: center;
            flex-direction: column;
        }
        #anger-overlay.show { display: flex; }

        .evil-eyes {
            display: flex; gap: 60px;
            animation: eyesAppear 0.5s ease-out forwards;
        }

        .eye {
            width: 80px; height: 30px;
            background: #fff; border-radius: 50%;
            box-shadow: 0 0 30px #ff0000, 0 0 60px #ff0000, inset 0 0 15px #ff0000;
            position: relative;
        }

        .eye::after {
            content: '';
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 10px; height: 10px;
            background: #000; border-radius: 50%;
        }

        @keyframes eyesAppear {
            0% { opacity: 0; transform: scale(0.5); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* --- ЭКРАН ПРОИГРЫША (ТРЕЩИНЫ) --- */
        #game-over-overlay {
            display: none;
            position: fixed; top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 2000;
            background: #000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
        }

        #game-over-overlay.show { display: flex; }

        .crack-effect {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" preserveAspectRatio="none"><path d="M500,500 L100,100 M500,500 L900,150 M500,500 L800,900 M500,500 L150,800 M500,500 L300,50 M500,500 L700,950 M500,500 L50,400 M500,500 L950,600" stroke="rgba(255,255,255,0.6)" stroke-width="2" fill="none"/><path d="M500,500 L150,300 M500,500 L850,400 M500,500 L400,850 M500,500 L600,100" stroke="rgba(200,200,200,0.4)" stroke-width="1" fill="none"/></svg>');
            background-size: cover;
            pointer-events: none;
            opacity: 0;
        }

        .crack-effect.animate {
            animation: crackAnim 1s forwards;
        }

        @keyframes crackAnim {
            0% { opacity: 0; transform: scale(1.5); }
            20% { opacity: 1; transform: scale(1); }
            100% { opacity: 1; transform: scale(1); }
        }

        .game-over-text {
            color: #ff0000;
            font-size: clamp(40px, 8vw, 100px);
            font-weight: 900;
            letter-spacing: 0.1em;
            text-shadow: 0 0 20px #ff0000;
            opacity: 0;
            margin-bottom: 20px;
            z-index: 2;
        }

        .game-over-text.animate {
            animation: fadeInText 2s forwards 1s; 
        }

        .game-over-subtext {
            color: #666;
            font-size: clamp(12px, 1.5vw, 16px);
            opacity: 0;
            z-index: 2;
        }

        .game-over-subtext.animate {
            animation: fadeInText 2s forwards 2.5s;
        }

        @keyframes fadeInText {
            to { opacity: 1; }
        }

        /* --- СЕКРЕТНАЯ ПАПКА (ТЕРМИНАЛ И КЛАВИАТУРА) --- */
        #skull-modal {
            display: none;
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: #000;
            z-index: 300;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', monospace;
        }

        #skull-modal.show { display: flex; }

        #secret-terminal {
            width: 80%;
            max-width: 800px;
            height: 40vh;
            background: #000;
            color: #00ff00; 
            font-size: 18px;
            padding: 20px;
            overflow-y: auto;
            white-space: pre-wrap;
            margin-bottom: 30px;
            text-shadow: 0 0 5px #00ff00;
            box-sizing: border-box;
        }

        #fake-keyboard {
            display: none; 
            flex-direction: column;
            gap: 8px;
            background: #111;
            padding: 15px;
            border-radius: 10px;
            border: 2px solid #333;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            width: 90%;
            max-width: 700px;
        }

        #fake-keyboard.show { display: flex; }

        .kbd-row {
            display: flex;
            justify-content: center;
            gap: 6px;
        }

        .key {
            background: #222;
            color: #888;
            border: 1px solid #444;
            border-radius: 4px;
            padding: 10px 0;
            width: 40px;
            text-align: center;
            font-size: 14px;
            box-shadow: 0 3px 0 #000;
            transition: all 0.1s;
        }

        .key.space { width: 200px; }

        .key.active {
            background: #00ff00;
            color: #000;
            box-shadow: 0 0 10px #00ff00;
            transform: translateY(3px);
            border-color: #00ff00;
        }

        #secret-terminal::-webkit-scrollbar { width: 8px; }
        #secret-terminal::-webkit-scrollbar-thumb { background: #00ff00; }

    </style>
</head>
<body>

    <button id="start-btn">НАЧАТЬ ИГРУ</button>

    <div id="scene-intro">
        <svg id="silhouette" width="200" height="300" viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg">
            <circle cx="100" cy="60" r="45" fill="#000000" stroke="#ffffff" stroke-width="2"/>
            <path d="M 20 300 C 20 150, 60 120, 100 120 C 140 120, 180 150, 180 300 Z" fill="#000000" stroke="#ffffff" stroke-width="2"/>
        </svg>
        <div id="dialogue-box-intro">
            <span id="text-intro"></span><span class="cursor" id="cursor-intro" style="display:none;"></span>
        </div>
        <div id="choices">
            <button class="choice-btn">ДА</button>
            <button class="choice-btn">НЕТ</button>
        </div>
    </div>

    <div id="scene-room">
        <div id="text-room"></div>
        <div id="emerging-board"></div>
        <svg id="seated-figure" viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg">
            <circle cx="100" cy="60" r="45" fill="#050505" />
            <path d="M 20 300 C 20 150, 60 120, 100 120 C 140 120, 180 150, 180 300 Z" fill="#050505" />
        </svg>
        <div id="smoke-container"></div>
        <div id="chair"></div>
        <div id="table"></div>
    </div>

    <div id="desktop-interface">
        
        <div class="desktop-icon" onclick="openFolder('history')">
            <div class="folder-icon">📁</div>
            <div class="icon-label">История нашей игры</div>
        </div>

        <div class="desktop-icon" onclick="openFolder('task')">
            <div class="folder-icon">📁</div>
            <div class="icon-label">Задание</div>
        </div>

        <div class="desktop-icon" onclick="openFolder('skull')">
            <div class="skull-icon">💀</div>
            <div class="icon-label">????</div>
        </div>

        <div class="taskbar">
            <div class="taskbar-start">ПУСК</div>
        </div>
    </div>

    <div id="letter-modal" onclick="closeLetter(event)">
        <div class="letter-paper" onclick="event.stopPropagation()">
            <div class="close-btn" onclick="closeLetter(event)">X</div>
            <div class="photo-frame">
                <img src="https://images.unsplash.com/photo-1542350599-2d0912e376a1?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80" 
                     onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'200\' height=\'250\'><rect width=\'200\' height=\'250\' fill=\'%23333\'/><text x=\'100\' y=\'125\' fill=\'%23888\' font-size=\'20\' text-anchor=\'middle\' font-family=\'sans-serif\'>ФОТО УТЕРЯНО</text></svg>'"
                     alt="Старое фото" class="old-photo">
            </div>
            <div class="letter-text">
                <h3>1987 год.</h3>
                <p>Новая засекреченная база у которой даже нет имени в которой проводится игра на выживание.</p>
                <p class="highlight">УДАЧНОЙ ИГРЫ!!!</p>
            </div>
        </div>
    </div>

    <div id="task-modal">
        <div class="task-window">
            <div class="task-titlebar">
                <span>TEST.EXE</span>
                <span style="cursor:pointer;" onclick="document.getElementById('task-modal').classList.remove('show')">X</span>
            </div>
            <div class="task-content" id="task-content">
            </div>
        </div>
    </div>

    <div id="skull-modal">
        <div id="secret-terminal"></div>
        
        <div id="fake-keyboard">
            <div class="kbd-row">
                <div class="key">й</div><div class="key">ц</div><div class="key">у</div><div class="key">к</div><div class="key">е</div><div class="key">н</div><div class="key">г</div><div class="key">ш</div><div class="key">щ</div><div class="key">з</div><div class="key">х</div><div class="key">ъ</div>
            </div>
            <div class="kbd-row">
                <div class="key">ф</div><div class="key">ы</div><div class="key">в</div><div class="key">а</div><div class="key">п</div><div class="key">р</div><div class="key">о</div><div class="key">л</div><div class="key">д</div><div class="key">ж</div><div class="key">э</div>
            </div>
            <div class="kbd-row">
                <div class="key">я</div><div class="key">ч</div><div class="key">с</div><div class="key">м</div><div class="key">и</div><div class="key">т</div><div class="key">ь</div><div class="key">б</div><div class="key">ю</div>
            </div>
            <div class="kbd-row">
                <div class="key space">пробел</div>
            </div>
        </div>
    </div>

    <div id="crt-overlay"></div>

    <div id="anger-overlay">
        <div class="evil-eyes">
            <div class="eye"></div>
            <div class="eye"></div>
        </div>
    </div>

    <div id="game-over-overlay">
        <div class="crack-effect" id="crack-effect"></div>
        <div class="game-over-text" id="game-over-text">ИГРА ПРОИГРАНА</div>
        <div class="game-over-subtext" id="game-over-subtext">твоя судьба скажу честно не очень</div>
    </div>

    <script>
        const startBtn = document.getElementById('start-btn');
        const sceneIntro = document.getElementById('scene-intro');
        const silhouette = document.getElementById('silhouette');
        const textIntro = document.getElementById('text-intro');
        const cursorIntro = document.getElementById('cursor-intro');
        const choices = document.getElementById('choices');
        
        const sceneRoom = document.getElementById('scene-room');
        const textRoom = document.getElementById('text-room');
        const smokeContainer = document.getElementById('smoke-container');
        
        const emergingBoard = document.getElementById('emerging-board');
        const desktopInterface = document.getElementById('desktop-interface');
        const seatedFigure = document.getElementById('seated-figure');
        const table = document.getElementById('table');
        const chair = document.getElementById('chair');
        
        const letterModal = document.getElementById('letter-modal');
        const taskModal = document.getElementById('task-modal');
        const taskContent = document.getElementById('task-content');
        
        const skullModal = document.getElementById('skull-modal');
        const secretTerminal = document.getElementById('secret-terminal');
        const fakeKeyboard = document.getElementById('fake-keyboard');

        const questions = [
            {
                q: "КАК ЗВАЛИ ПЕРВУЮ НАШУ УЧИТЕЛЬНИЦУ?",
                options: ["Татьяна Николаевна", "Татьяна Леонидовна"],
                correct: 1
            },
            {
                q: "ВЕРНО ЛИ ЧТО ЖЕНСКИЙ МОЗГ РАЗВИТ ЛУЧШЕ ЧЕМ МУЖСКОЙ?",
                options: ["Да", "Нет"],
                correct: 1
            },
            {
                q: "УВАЖАЕШЬ ЛИ ТЫ ПЧЕЛОК?",
                options: ["Да", "Нет"],
                correct: 0
            }
        ];

        let currentQuestionIndex = 0;

        function typeWriter(element, text, i, speed, fnCallback) {
            if (i < text.length) {
                element.innerHTML = text.substring(0, i + 1);
                setTimeout(function() { typeWriter(element, text, i + 1, speed, fnCallback); }, speed); 
            } else if (typeof fnCallback == 'function') {
                setTimeout(fnCallback, 500); 
            }
        }

        function startSmoke() {
            const interval = setInterval(() => {
                if (desktopInterface.classList.contains('show')) { clearInterval(interval); return; }
                const smoke = document.createElement('div');
                smoke.classList.add('smoke');
                const randomX = Math.floor(Math.random() * 20) - 10; 
                smoke.style.left = `calc(50% + ${randomX}px)`;
                smoke.style.animation = `smokeRise ${3.5 + Math.random() * 2}s ease-out forwards`;
                smokeContainer.appendChild(smoke);
                setTimeout(() => smoke.remove(), 5500);
            }, 250); 
        }

        function loadQuestion() {
            if (currentQuestionIndex >= questions.length) {
                taskContent.innerHTML = `
                    <div class="task-question" style="color: green;">ВСЕ ЗАДАНИЯ ВЫПОЛНЕНЫ</div>
                    <p style="text-align:center; font-size: 16px;">Вы выжили... пока что.</p>
                    <button class="task-btn" style="text-align:center;" onclick="document.getElementById('task-modal').classList.remove('show')">ЗАКРЫТЬ</button>
                `;
                return;
            }

            const q = questions[currentQuestionIndex];
            taskContent.innerHTML = `
                <div class="task-question">${q.q}</div>
                <button class="task-btn" onclick="answerQuestion(0)">А) ${q.options[0]}</button>
                <button class="task-btn" onclick="answerQuestion(1)">Б) ${q.options[1]}</button>
            `;
        }

        async function runSkullSequence() {
            secretTerminal.innerHTML = '';
            fakeKeyboard.classList.remove('show');
            
            const chars = "0123456789ABCDEF";
            for(let i=0; i<150; i++) {
                let hex = "";
                for(let j=0; j<4; j++) hex += chars[Math.floor(Math.random()*16)];
                secretTerminal.innerHTML += hex + " ";
                if (i % 10 === 0) secretTerminal.innerHTML += "\n";
                secretTerminal.scrollTop = secretTerminal.scrollHeight;
                await new Promise(r => setTimeout(r, 20)); 
            }
            
            await new Promise(r => setTimeout(r, 1000));
            secretTerminal.innerHTML += "\n\n> Чего тебе нужно заключённый?";
            secretTerminal.scrollTop = secretTerminal.scrollHeight;
            
            await new Promise(r => setTimeout(r, 1500));
            fakeKeyboard.classList.add('show');
            
            const phrase = "спаси меня боже";
            const keys = document.querySelectorAll('.key');
            
            for(let i=0; i<phrase.length; i++) {
                let char = phrase[i];
                
                if (char === ' ') {
                    const spaceKey = document.querySelector('.key.space');
                    spaceKey.classList.add('active');
                    secretTerminal.innerHTML += " ";
                    await new Promise(r => setTimeout(r, 150));
                    spaceKey.classList.remove('active');
                } else {
                    let foundKey = Array.from(keys).find(k => k.textContent === char);
                    if (foundKey) {
                        foundKey.classList.add('active');
                        secretTerminal.innerHTML += char;
                        await new Promise(r => setTimeout(r, 150));
                        foundKey.classList.remove('active');
                    } else {
                        secretTerminal.innerHTML += char;
                    }
                }
                secretTerminal.scrollTop = secretTerminal.scrollHeight;
                await new Promise(r => setTimeout(r, 100)); 
            }
        }

        window.openFolder = function(folderName) {
            if (folderName === 'history') {
                letterModal.classList.add('show');
            } else if (folderName === 'task') {
                currentQuestionIndex = 0; 
                loadQuestion();
                taskModal.classList.add('show');
            } else if (folderName === 'skull') {
                skullModal.classList.add('show');
                runSkullSequence(); 
            }
        };

        window.closeLetter = function(event) {
            if (event.target.id === 'letter-modal' || event.target.className === 'close-btn') {
                letterModal.classList.remove('show');
            }
        };

        function speakCreepy(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ru-RU';
                utterance.rate = 0.6; 
                utterance.pitch = 0.3; 
                window.speechSynthesis.speak(utterance);
            }
        }

        window.answerQuestion = function(selectedIndex) {
            const q = questions[currentQuestionIndex];
            const isCorrect = (selectedIndex === q.correct);

            if (isCorrect) {
                currentQuestionIndex++;
                loadQuestion();
            } else {
                if (currentQuestionIndex === 0 || currentQuestionIndex === 1) {
                    taskModal.classList.remove('show');
                    const crt = document.getElementById('crt-overlay');
                    crt.classList.add('active');
                    
                    let eyeDuration = (currentQuestionIndex === 0) ? 1500 : 3000; 
                    
                    setTimeout(() => {
                        crt.classList.remove('active');
                        document.getElementById('anger-overlay').classList.add('show');
                        
                        if (currentQuestionIndex === 1) {
                            speakCreepy("Еще раз...");
                        }
                        
                        setTimeout(() => {
                            document.getElementById('anger-overlay').classList.remove('show');
                            
                            currentQuestionIndex++;
                            loadQuestion();
                            taskModal.classList.add('show');
                            
                        }, eyeDuration);
                        
                    }, 500);

                } else if (currentQuestionIndex === 2) {
                    taskModal.classList.remove('show');
                    document.getElementById('crt-overlay').classList.add('active');
                    
                    setTimeout(() => {
                        document.getElementById('crt-overlay').classList.remove('active');
                        
                        const gameOver = document.getElementById('game-over-overlay');
                        gameOver.classList.add('show');
                        
                        setTimeout(() => {
                            document.getElementById('crack-effect').classList.add('animate');
                            document.getElementById('game-over-text').classList.add('animate');
                            document.getElementById('game-over-subtext').classList.add('animate');
                        }, 100);
                        
                    }, 500);
                }
            }
        };

        startBtn.addEventListener('click', () => {
            startBtn.style.display = 'none';
            sceneIntro.style.display = 'flex';
            setTimeout(() => silhouette.classList.add('show'), 100);
            setTimeout(() => {
                cursorIntro.style.display = 'inline-block';
                typeWriter(textIntro, "Хочешь приступить к игре?", 0, 100, function() {
                    choices.style.display = 'flex';
                    setTimeout(() => {
                        silhouette.classList.add('jump');
                        setTimeout(() => {
                            choices.style.display = 'none';
                            textIntro.innerHTML = ''; 
                        }, 300);
                        setTimeout(() => {
                            silhouette.classList.remove('jump');
                            typeWriter(textIntro, "Твое мнение ничего не значит. Ты будешь играть.", 0, 100, function() {
                                setTimeout(() => {
                                    sceneIntro.style.opacity = '0';
                                    setTimeout(() => {
                                        sceneIntro.style.display = 'none';
                                        sceneRoom.style.display = 'flex';
                                        setTimeout(() => {
                                            sceneRoom.style.opacity = '1';
                                            startSmoke(); 
                                            setTimeout(() => {
                                                textRoom.style.opacity = '1';
                                                typeWriter(textRoom, "Присаживайся. У нас мало времени.", 0, 120, function() {
                                                    setTimeout(() => {
                                                        textRoom.innerHTML = ''; 
                                                        typeWriter(textRoom, "Выполни все задания и выйдешь из игры.\nНе выполнишь — будет плохо.", 0, 80, function() {
                                                            setTimeout(() => {
                                                                textRoom.style.opacity = '0'; 
                                                                emergingBoard.classList.add('show'); 
                                                                setTimeout(() => {
                                                                    emergingBoard.classList.add('zoom-effect');
                                                                    seatedFigure.style.opacity = '0';
                                                                    table.style.opacity = '0';
                                                                    chair.style.opacity = '0';
                                                                    setTimeout(() => {
                                                                        sceneRoom.style.display = 'none';
                                                                        desktopInterface.style.display = 'block';
                                                                        setTimeout(() => { desktopInterface.classList.add('show'); }, 50);
                                                                    }, 1500);
                                                                }, 3000);
                                                            }, 2500); 
                                                        });
                                                    }, 2000); 
                                                });
                                            }, 3000);
                                        }, 50);
                                    }, 2000); 
                                }, 2000); 
                            });
                        }, 800);
                    }, 2500); 
                });
            }, 5000); 
        });
    </script>
</body>
</html>
